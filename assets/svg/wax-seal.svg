<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Wax seal with jali ring and A&G monogram -->
  
  <!-- Outer wax rim — deep red -->
  <circle cx="100" cy="100" r="96" fill="#5C0E0E" opacity="0.3"/>
  
  <!-- Main wax body -->
  <circle cx="100" cy="100" r="90" fill="#7B1414"/>
  
  <!-- Wax texture highlight (top-left light source) -->
  <ellipse cx="75" cy="72" rx="30" ry="20" fill="#A03030" opacity="0.4"/>
  
  <!-- Jali lattice ring -->
  <g fill="none" stroke="#C9A84C" stroke-width="1.2" opacity="0.9">
    <!-- Outer ring -->
    <circle cx="100" cy="100" r="85" stroke-width="1.5" opacity="0.7"/>
    <!-- Inner ring -->
    <circle cx="100" cy="100" r="70" stroke-width="1"/>
    
    <!-- Geometric jali pattern between rings — 12 segments -->
    <!-- Diamonds/stars at each cardinal/diagonal point -->
    <!-- Top -->
    <polygon points="100,17 105,28 100,32 95,28" fill="#C9A84C" opacity="0.8"/>
    <!-- Bottom -->
    <polygon points="100,183 105,172 100,168 95,172" fill="#C9A84C" opacity="0.8"/>
    <!-- Left -->
    <polygon points="17,100 28,95 32,100 28,105" fill="#C9A84C" opacity="0.8"/>
    <!-- Right -->
    <polygon points="183,100 172,95 168,100 172,105" fill="#C9A84C" opacity="0.8"/>
    
    <!-- Diagonal connectors (jali lattice lines) -->
    <!-- Top-right arc segment dots -->
    <circle cx="140" cy="32" r="2.5" fill="#C9A84C" opacity="0.7"/>
    <circle cx="168" cy="60" r="2.5" fill="#C9A84C" opacity="0.7"/>
    <!-- Top-left -->
    <circle cx="60" cy="32" r="2.5" fill="#C9A84C" opacity="0.7"/>
    <circle cx="32" cy="60" r="2.5" fill="#C9A84C" opacity="0.7"/>
    <!-- Bottom-right -->
    <circle cx="140" cy="168" r="2.5" fill="#C9A84C" opacity="0.7"/>
    <circle cx="168" cy="140" r="2.5" fill="#C9A84C" opacity="0.7"/>
    <!-- Bottom-left -->
    <circle cx="60" cy="168" r="2.5" fill="#C9A84C" opacity="0.7"/>
    <circle cx="32" cy="140" r="2.5" fill="#C9A84C" opacity="0.7"/>
    
    <!-- 8-pointed star insets at 45° positions -->
    <g transform="rotate(45, 100, 100)">
      <polygon points="100,17 105,28 100,32 95,28" fill="#C9A84C" opacity="0.5"/>
      <polygon points="100,183 105,172 100,168 95,172" fill="#C9A84C" opacity="0.5"/>
      <polygon points="17,100 28,95 32,100 28,105" fill="#C9A84C" opacity="0.5"/>
      <polygon points="183,100 172,95 168,100 172,105" fill="#C9A84C" opacity="0.5"/>
    </g>
    
    <!-- Thin dividing lines across ring -->
    <line x1="100" y1="16" x2="100" y2="32" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
    <line x1="100" y1="168" x2="100" y2="184" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
    <line x1="16" y1="100" x2="32" y2="100" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
    <line x1="168" y1="100" x2="184" y2="100" stroke="#C9A84C" stroke-width="0.8" opacity="0.6"/>
  </g>
  
  <!-- Inner wax disc background for monogram -->
  <circle cx="100" cy="100" r="66" fill="#6B1010"/>
  <circle cx="100" cy="100" r="64" fill="#7B1414"/>
  
  <!-- Gold inner ring -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="#C9A84C" stroke-width="0.8" opacity="0.8"/>
  
  <!-- "A & G" Monogram text — rendered as text element (Pinyon Script loaded via CSS) -->
  <!-- Note: Font rendering done via foreignObject fallback or via CSS on HTML element -->
  <!-- SVG text uses system serif as fallback, actual font applied via CSS when embedded -->
  <text x="100" y="115" 
        font-family="'Pinyon Script', 'Palatino Linotype', serif" 
        font-size="46" 
        fill="#C9A84C" 
        text-anchor="middle" 
        opacity="0.95"
        style="filter: drop-shadow(0 1px 2px rgba(0,0,0,0.5))">A&amp;G</text>
  
  <!-- Subtle wax crack lines for realism -->
  <line x1="100" y1="40" x2="98" y2="55" stroke="#5C0E0E" stroke-width="0.5" opacity="0.4"/>
  <line x1="130" y1="55" x2="128" y2="68" stroke="#5C0E0E" stroke-width="0.4" opacity="0.3"/>
  
  <!-- Bottom shadow/depth -->
  <ellipse cx="100" cy="185" rx="70" ry="8" fill="#1A0000" opacity="0.4"/>
</svg>
