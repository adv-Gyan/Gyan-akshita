<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 40" preserveAspectRatio="xMidYMid meet">
  <!-- Ornamental section divider with central arch motif -->
  
  <!-- Left line -->
  <line x1="0" y1="20" x2="220" y2="20" stroke="#C9A84C" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Left decorative element -->
  <g transform="translate(225,20)" opacity="0.8">
    <circle cx="0" cy="0" r="2" fill="#C9A84C"/>
    <line x1="-10" y1="0" x2="-4" y2="0" stroke="#C9A84C" stroke-width="1"/>
    <line x1="4" y1="0" x2="10" y2="0" stroke="#C9A84C" stroke-width="1"/>
  </g>
  
  <!-- Central mini arch motif -->
  <g transform="translate(300,20)">
    <!-- Tiny arch -->
    <path d="M -20 12 L -20 0 Q -20 -16 0 -16 Q 20 -16 20 0 L 20 12" 
          fill="none" stroke="#C9A84C" stroke-width="1.2" opacity="0.9"/>
    <!-- Center diamond -->
    <polygon points="0,-6 4,0 0,6 -4,0" fill="#C9A84C" opacity="0.9"/>
    <!-- Base line -->
    <line x1="-22" y1="12" x2="22" y2="12" stroke="#C9A84C" stroke-width="1"/>
    <!-- Side dots -->
    <circle cx="-26" cy="6" r="1.5" fill="#C9A84C" opacity="0.7"/>
    <circle cx="26" cy="6" r="1.5" fill="#C9A84C" opacity="0.7"/>
  </g>
  
  <!-- Right decorative element -->
  <g transform="translate(375,20)" opacity="0.8">
    <circle cx="0" cy="0" r="2" fill="#C9A84C"/>
    <line x1="-10" y1="0" x2="-4" y2="0" stroke="#C9A84C" stroke-width="1"/>
    <line x1="4" y1="0" x2="10" y2="0" stroke="#C9A84C" stroke-width="1"/>
  </g>
  
  <!-- Right line -->
  <line x1="380" y1="20" x2="600" y2="20" stroke="#C9A84C" stroke-width="0.8" opacity="0.5"/>
</svg>
